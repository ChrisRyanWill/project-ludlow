name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Unit + API tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:api
  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:site
  reproducible:
    name: Reproducible build (local and Docker app.js match)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build the Docker image's build stage and compare app.js
        run: |
          set -euo pipefail
          docker build --target build -t ludlow-build .
          local=$(sha256sum web/dist/app.js | cut -d' ' -f1)
          image=$(docker run --rm ludlow-build sha256sum web/dist/app.js | cut -d' ' -f1)
          echo "local  $local"; echo "docker $image"
          # two empty outputs (a missing file, a failed docker run) would compare equal: require real hashes
          [[ "$local" =~ ^[0-9a-f]{64}$ ]] || { echo "no local hash"; exit 1; }
          [[ "$image" =~ ^[0-9a-f]{64}$ ]] || { echo "no docker hash"; exit 1; }
          test "$local" = "$image"
